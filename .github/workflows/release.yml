name: Release
on:
  push:
    branches:
      - main
jobs:
  release:
    name: Release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create release
        run: |
          zip -r CheDocs.zip CheDocs
          gh release create v$GITHUB_RUN_NUMBER 'CheDocs.zip'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
